<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pendaftaran</title>
  <style>
    header {
      font-family: Arial, sans-serif;
      border-top: 20px solid #2a5bd7;
      padding: 10px 20px;
    }
    form {
      border: 1px solid #333;
      padding: 10px 15px;
      max-width: 500px;
      margin: 20px;
    }
    form div {
      margin-bottom: 14px;
    }
    label {
      display: block;
    }
    .inline label {
      display: inline;
    }
  </style>
</head>
<body>

  <form action="#" method="post" enctype="multipart/form-data">
    <h2>Formulir Pendaftaran</h2>

    <div>
      <label for="nama">Nama Lengkap:</label>
      <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required>
    </div>

    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="nama@email.com" required>
    </div>

    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
    </div>

    <div>
      <label for="umur">Umur:</label>
      <input type="number" id="umur" name="umur" min="1" max="100">
    </div>

    <div>
      <label for="tgl-lahir">Tanggal Lahir:</label>
      <input type="date" id="tgl-lahir" name="tanggal_lahir">
    </div>

    <div class="inline">
      <label>Jenis Kelamin:</label>
      <input type="radio" id="laki" name="gender" value="laki-laki">
      <label for="laki">Laki-laki</label><br>
      <input type="radio" id="perempuan" name="gender" value="perempuan">
      <label for="perempuan">Perempuan</label>
    </div>

    <div class="inline">
      <label>Hobi:</label>
      <input type="checkbox" id="coding" name="hobi" value="coding">
      <label for="coding">Coding</label><br>
      <input type="checkbox" id="gaming" name="hobi" value="gaming">
      <label for="gaming">Gaming</label><br>
      <input type="checkbox" id="olahraga" name="hobi" value="olahraga">
      <label for="olahraga">Olahraga</label>
    </div>

    <div>
      <label for="jurusan">Jurusan:</label>
      <select id="jurusan" name="jurusan">
        <option value="">-- Pilih Jurusan --</option>
        <option value="ti">Teknik Informatika</option>
        <option value="si">Sistem Informasi</option>
        <option value="tk">Teknik Komputer</option>
      </select>
    </div>

    <div>
      <label for="alamat">Alamat:</label>
      <textarea id="alamat" name="alamat" rows="5" cols="40" placeholder="Masukkan alamat"></textarea>
    </div>

    <div>
      <label for="foto">Foto:</label>
      <input type="file" id="foto" name="foto" accept="image/*">
    </div>

    <div>
      <label for="website">Website:</label>
      <input type="url" id="website" name="website" placeholder="https://example.com">
    </div>

    <div>
      <button type="submit">Kirim</button>
      <button type="reset">Reset</button>
    </div>
  </form>

</body>
</html>
